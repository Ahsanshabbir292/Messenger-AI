<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perseus Bot | Enterprise Facebook Messenger Automation</title>
    <meta name="description" content="Perseus Bot is an enterprise-grade platform for Facebook Messenger automation, dynamic broadcasting, real-time customer chat engagement, and analytics." />
    
    <!-- Ultra-reliable, zero-network-latency inline custom SVG favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234F46E5'/><path d='M30 30h40v20c0 11-9 20-20 20S30 61 30 50V30z' fill='white'/><circle cx='50' cy='50' r='10' fill='%234F46E5'/></svg>">
    
    <!-- DNS preconnect speed optimization for fast font and resource delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Defensive check to avoid "Cannot set property fetch of #<Window> which has only a getter"
      // Some libraries (like gaxios/node-fetch polyfills) try to assign to window.fetch
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.writable && !desc.set) {
          console.warn('[App] window.fetch is read-only. Protecting against polyfill override.');
          const original = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: () => original,
            set: () => {} // Silently ignore assignment
          });
        }
      } catch (e) {
        console.error('[App] Error in fetch protector:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
